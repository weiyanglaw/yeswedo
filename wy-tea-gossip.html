<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>八卦不算加班（預覽）</title>
<style>
body{margin:0;min-height:100dvh;background:#2b3a55;font-family:"Noto Sans TC",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;color:#FFF3D6}
.open{padding:16px 22px;border-radius:999px;border:2px solid #fff;background:linear-gradient(#FFEFB8,#E9C46A 40%,#C08A2E);color:#4A2F0C;font:900 17px sans-serif;box-shadow:0 3px 0 #8A6424}
#wyGos{position:fixed;inset:0;z-index:99;background:radial-gradient(#1a2c66cc,#081224f2);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));animation:gIn .3s ease}
@keyframes gIn{from{opacity:0;transform:scale(.97)}}
.card{position:relative;width:min(94vw,440px);display:flex;flex-direction:column;gap:10px;padding:14px;box-sizing:border-box;border-radius:24px;background:repeating-linear-gradient(#FFFBF2 0 27px,#F1E2C4 27px 28px);border:4px solid #E9C46A;box-shadow:0 0 0 3px #FFF6DC inset,0 0 0 7px #C9963C,0 14px 40px #0008}
.hd{display:flex;align-items:center;gap:10px;padding-right:78px;min-height:58px}.hd img{width:50px;height:50px;object-fit:contain}
.hd small{display:block;font:800 12.5px sans-serif;color:#8A6424}.hd b{display:block;font:900 clamp(21px,6vw,25px)/1.2 sans-serif;color:#1A2C66;white-space:nowrap}
.stamp{position:absolute;top:10px;right:52px;width:54px;height:62px;transform:rotate(6deg);background:#3F63B5;border:3px dashed #fff;outline:3px solid #3F63B5;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF3D6;font:900 10px sans-serif}
.stamp img{width:30px;height:30px;object-fit:contain}
.x{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:2px solid #fff;background:linear-gradient(#FFEFB8,#E9C46A 40%,#C08A2E);color:#5A3A10;font:900 20px/1 sans-serif;box-shadow:0 3px 0 #8A6424}
.line{height:3px;border-radius:3px;background:linear-gradient(90deg,#C9963C,#F3D27A,#C9963C)}
.sofa{position:relative;border-radius:18px;padding:14px 12px 0;background:linear-gradient(#FFF6F2,#F8E4E2);border:3px solid #D4B26F;overflow:hidden;min-height:330px;display:flex;flex-direction:column}
.bub{position:relative;background:#fff;border-radius:18px;padding:14px 16px;border:2.5px solid #1A2C66;box-shadow:0 4px 0 #1A2C6622;color:#1A2C66;font:800 16px/1.65 sans-serif;min-height:5em;word-break:normal;overflow-wrap:anywhere;line-break:strict;text-wrap:balance}
.bub:after{content:"";position:absolute;left:var(--tx,30%);bottom:-13px;width:22px;height:22px;background:#fff;border-right:2.5px solid #1A2C66;border-bottom:2.5px solid #1A2C66;transform:rotate(45deg)}
.bub small{display:block;font:900 12px sans-serif;color:#C9963C;margin-bottom:2px;letter-spacing:.08em}
.pals{margin-top:auto;display:flex;justify-content:space-around;align-items:flex-end;padding-top:22px;position:relative}
.pals:before{content:"";position:absolute;left:4%;right:4%;bottom:0;height:46px;border-radius:22px 22px 0 0;background:linear-gradient(#F2B8C2,#E39CAB);box-shadow:inset 0 6px 0 #F9D6DD}
.pals img{position:relative;width:26%;max-width:96px;transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:50% 100%}
.pals img.talk{transform:translateY(-10px) scale(1.12) rotate(-4deg)}
.pals img.lean{transform:rotate(7deg)}
.who{position:absolute;bottom:52px;left:0;right:0;text-align:center;font:900 12px sans-serif;color:#1A2C66}
.btns{display:flex;gap:8px}.btns button{flex:1;min-height:46px;border-radius:999px;border:2px solid #fff;background:linear-gradient(#FFEFB8,#E9C46A 40%,#C08A2E);color:#4A2F0C;font:900 16px sans-serif;box-shadow:0 3px 0 #8A6424}
.btns .alt{background:#FFFBF2;border:2px solid #D4B26F;box-shadow:0 3px 0 #D4B26F}
.sig{padding:7px;border-radius:12px;background:#F3E3BE;text-align:center;color:#8A6424;font:800 13px sans-serif}
.typing i{display:inline-block;width:8px;height:8px;margin:0 3px;border-radius:50%;background:#1A2C66;animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{opacity:.25;transform:translateY(-3px)}}
</style><style>body.emb{background:transparent!important}body.emb .open{display:none}body.emb #wyGos{background:transparent!important;animation:none;padding:0}</style></head><body><button class="open" onclick="openGos()">點粉色沙發（八卦不算加班）</button>

const NM={lin:'林律師',meng:'夢奇奇飼養者',ham:'哈姆太郎',sal:'薪水掌門人'},KW={lin:'林律師',meng:'夢奇奇',ham:'哈姆太郎',sal:'薪水掌門人'};
const ORDER=['meng','ham','sal'];
function teller(s){const ok=ORDER.filter(k=>!s.includes(KW[k])&&!(k==='lin'&&/林律師|律師/.test(s)));const pool=ok.length?ok:['meng','ham','sal'];return pool[Math.floor(Math.random()*pool.length)]}
function nextLine(){let q=[];try{q=JSON.parse(localStorage.getItem('wy-gos-q')||'[]')}catch(e){}if(!q.length){q=L.map((_,i)=>i).sort(()=>Math.random()-.5)}const i=q.shift();try{localStorage.setItem('wy-gos-q',JSON.stringify(q))}catch(e){}return L[i]}
function beep(){try{const A=window.__ac||(window.__ac=new AudioContext());const t=A.currentTime;[880,1175].forEach((f,k)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,t+k*.09);g.gain.linearRampToValueAtTime(.05,t+k*.09+.01);g.gain.exponentialRampToValueAtTime(.001,t+k*.09+.15);o.connect(g);g.connect(A.destination);o.start(t+k*.09);o.stop(t+k*.09+.16)})}catch(e){}}
function openGos(){
 const r=document.createElement('div');r.id='wyGos';
 r.innerHTML=`<div class="card"><button class="x" aria-label="返回茶水間">×</button>
 <div class="hd"><img src="${IMG.logo}"><div><small>德威陽國際法律事務所</small><b>八卦不算加班</b></div></div>
 <div class="stamp"><img src="${IMG.logo}">茶水間</div><div class="line"></div>
 <div class="sofa"><div class="bub"><small id="gw">小聲說</small><span id="gt"></span></div>
 <div class="pals">${ORDER.map(k=>`<img data-k="${k}" src="${IMG[k]}" alt="${NM[k]}">`).join('')}</div></div>
 <div class="btns"><button id="gn">再聽一個</button><button class="alt" id="gx">回茶水間</button></div>
 <div class="sig">德威陽國際法律事務所・LINE @wylaw</div></div>`;
 document.body.append(r);const $=s=>r.querySelector(s);
 const close=()=>{r.remove();if(document.body.classList.contains('emb'))parent.postMessage('wy2fClose','*')};$('.x').onclick=close;$('#gx').onclick=close;
 let busy=false;
 function show(){if(busy)return;busy=true;const s=nextLine(),w=teller(s);
  r.querySelectorAll('.pals img').forEach(im=>{im.className=im.dataset.k===w?'talk':'lean'});
  const idx=ORDER.indexOf(w);$('.bub').style.setProperty('--tx',(16+idx*32)+'%');$('#gw').textContent=NM[w]+' 小聲說';
  const gt=$('#gt');gt.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';
  setTimeout(()=>{gt.textContent='';beep();let n=0;const tm=setInterval(()=>{n+=2;gt.textContent=s.slice(0,n);if(n>=s.length){clearInterval(tm);busy=false}},40)},650)}
 $('#gn').onclick=show;show()}
</script><script>(function(){const Q=new URLSearchParams(location.search+'&'+location.hash.slice(1));if(Q.has('embed')){document.body.classList.add('emb');openGos()}})();</script></body></html>
