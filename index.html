function talkToStaff(i){

function officeNext(){
 if(!activeOffice)return;
 const line=activeOffice[officeStep++],i=line[0];
 showSpeech(t(staff[i].name,staff[i].en),t(line[1],line[2]),'',null);
 if(officeStep>=activeOffice.length){activeOffice=null;officeTimer=setTimeout(()=>{$('speech').classList.remove('show')},5000)}
 else officeTimer=setTimeout(officeNext,4500+Math.min(line[1].length*80,2400));
}
function startOfficeTalk(){
 clearTimeout(officeTimer);clearTimeout(speechTimer);
 let next=Math.floor(Math.random()*officeDialogues.length);

}
