<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>德威陽｜有法度・法律探索城市</title><style>:root{--gold:#c29a48;--brown:#4a3026;--cream:#fff9ed}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Noto Sans TC',sans-serif;background:#f9f2e5;color:#392a25}header{background:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 5%;border-bottom:3px solid var(--gold);gap:12px}header strong{font-size:clamp(22px,4vw,35px)}header small{display:block;color:#806b55}header .tag{color:#b64c62;font-weight:700}.hero{text-align:center;padding:26px 15px 8px}.hero h1{margin:0;font-size:clamp(26px,5vw,43px)}.hero p{color:#75604d}.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;max-width:1250px;margin:10px auto;padding:0 15px}.scene{position:relative;min-height:570px;border-radius:25px;background:linear-gradient(#dff4ff 0%,#eaf8ed 55%,#cfe8c0);overflow:hidden;border:2px solid #d5c6a4;box-shadow:0 15px 40px #8d795433}.cloud{position:absolute;background:#ffffffb0;border-radius:100px;width:100px;height:28px;top:10%;left:10%}.cloud:before{content:'';position:absolute;background:white;border-radius:50%;height:42px;width:45px;top:-20px;left:20px}.cloud.two{left:73%;top:19%;transform:scale(.75)}.island{position:absolute;width:83%;height:66%;left:8.5%;top:24%;background:#9cc88a;border:12px solid #82aa6c;border-radius:47% 43% 45% 45%;transform:rotate(-9deg);box-shadow:0 26px 0 #b39b72,0 38px 0 #8c7459,0 50px 25px #537b5b55}.path{position:absolute;inset:19%;border:30px solid #e7d5ae;border-radius:45%;opacity:.9}.place{position:absolute;border:0;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .2s;filter:drop-shadow(0 9px 5px #0002);padding:0}.place:hover,.place:focus-visible{transform:translateY(-10px) scale(1.07);outline:none}.building{font-size:clamp(47px,7vw,75px);line-height:1}.place span:last-child{background:#fffdf3;padding:6px 10px;border:2px solid #a88c54;border-radius:100px;font-size:13px;font-weight:800;white-space:nowrap}.p1{left:40%;top:28%}.p2{left:16%;top:43%}.p3{left:69%;top:43%}.p4{left:27%;top:68%}.p5{left:60%;top:69%}.p6{left:42%;top:51%}.panel{background:white;border-radius:22px;padding:24px;box-shadow:0 10px 30px #8d79542b;align-self:start;min-height:410px;border:1px solid #ead8b9}.panel .eyebrow{color:#a17d3d;font-weight:800}.panel h2{margin:12px 0;font-size:26px}.panel p{line-height:1.85}.panel .question{background:#fff6e2;padding:13px;border-radius:12px;font-weight:700}.choices{display:grid;gap:9px;margin-top:15px}.choices button,.action{border:1px solid #bfa26c;background:#fffaf0;border-radius:10px;padding:12px;cursor:pointer;text-align:left;font-size:15px}.choices button:hover{background:#f7e6bf}.result{margin-top:15px;background:#f3f6ed;border-left:4px solid #88a76d;padding:12px;line-height:1.7}.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.links a{background:#55372b;color:white;text-decoration:none;padding:10px 15px;border-radius:10px}footer{text-align:center;padding:26px 10px;color:#6f5a4b;font-size:13px}@media(max-width:820px){.layout{grid-template-columns:1fr}.scene{min-height:490px}.panel{min-height:0}.place span:last-child{font-size:11px;padding:5px}.building{font-size:45px}.p2{left:9%}.p3{left:72%}.p4{left:17%}.p5{left:65%}}@media(max-width:400px){.scene{min-height:410px}.building{font-size:36px}.island{top:25%;height:61%}.place span:last-child{font-size:10px}.p1{top:30%}.p4,.p5{top:67%}}</style></head><body><header><div><strong>德威陽｜有法度</strong><small>WEI & YANG INTERNATIONAL LAW FIRM</small></div><div class="tag">是法，不是髮💗</div></header><section class="hero"><h1>歡迎來到法律探索城市</h1><p>點選城市裡的建築，探索生活中的法律問題！</p></section><main class="layout"><section class="scene" aria-label="可點選的法律城市"><div class="cloud"></div><div class="cloud two"></div><div class="island"><div class="path"></div></div><button class="place p1" data-id="court"><span class="building">🏛️</span><span>法院</span></button><button class="place p2" data-id="company"><span class="building">🏢</span><span>企業總部</span></button><button class="place p3" data-id="family"><span class="building">🏠</span><span>家庭住宅</span></button><button class="place p4" data-id="hospital"><span class="building">🏥</span><span>醫療中心</span></button><button class="place p5" data-id="labor"><span class="building">🏬</span><span>職場大樓</span></button><button class="place p6" data-id="firm"><span class="building">⚖️</span><span>德威陽事務所</span></button></section><aside class="panel" id="panel" aria-live="polite"></aside></main><footer>© 德威陽國際法律事務所｜本網站提供一般法律資訊，個案仍應由專業人士依具體事實評估。<br>免費互動網站示範版・無付費服務依賴</footer><script>const topics={court:{icon:'🏛️',title:'法院｜訴訟與程序',intro:'收到法院通知，不代表已經輸掉官司。先確認案件類型、通知內容與期限。',question:'收到法院寄來的文件，第一步該怎麼做？',choices:['先放著，等有空再看','確認文書內容、期限及應辦事項','直接在網路公開所有資料'],correct:1,explain:'法院文書可能涉及法定期間；請保留信封與文書，確認送達日期、案件類型及應辦事項。'},company:{icon:'🏢',title:'企業總部｜商務契約',intro:'企業合作不只看價格，也應確認交易主體、履約內容、驗收、付款及違約責任。',question:'簽訂商務契約前，哪個做法較妥當？',choices:['只看總價就簽名','確認交易對象與重要條款','全部交給口頭承諾'],correct:1,explain:'事前釐清交易主體、權利義務及爭議處理條款，有助於降低後續爭議。'},family:{icon:'🏠',title:'家庭住宅｜家事與繼承',intro:'婚姻、親子、財產與繼承問題，往往同時牽涉法律與家庭溝通。',question:'遇到遺產分配爭議，較合適的第一步是？',choices:['先確認繼承人、遺產與相關文件','直接處分所有遺產','不必查證任何資料'],correct:0,explain:'應先確認繼承關係、遺產範圍、債務及是否有遺囑，再評估處理方式。'},hospital:{icon:'🏥',title:'醫療中心｜醫療爭議',intro:'醫療結果不如預期，不一定代表有醫療過失；需檢視診療過程與相關證據。',question:'發生醫療爭議時，哪個作法較有助於釐清事實？',choices:['保存病歷及相關資料','只憑網路傳言判斷','立即刪除往來紀錄'],correct:0,explain:'保存診療紀錄、收據及溝通資料，有助於後續專業評估。'},labor:{icon:'🏬',title:'職場大樓｜勞資關係',intro:'勞動契約、工時、薪資及終止契約，都可能涉及勞動法規。',question:'雇主突然要求離職，勞工可以先做什麼？',choices:['不看文件直接簽署','保留通知、契約及薪資等資料','刪除所有訊息'],correct:1,explain:'先確認雇主提出的理由、文件內容與相關事實；是否符合法律規定須依個案判斷。'},firm:{icon:'⚖️',title:'德威陽國際法律事務所',intro:'由林柏均律師提供跨國商務、公司治理、智慧財產、民刑事訴訟、家事、勞動與醫療糾紛等法律服務。',question:'想進一步了解法律問題？',choices:[],explain:''}};function show(id){let t=topics[id];let p=document.getElementById('panel');p.innerHTML=`<div class="eyebrow">${t.icon} 法律探索站</div><h2>${t.title}</h2><p>${t.intro}</p>${t.choices.length?`<div class="question">${t.question}</div><div class="choices">${t.choices.map((x,i)=>`<button data-answer="${i}">${x}</button>`).join('')}</div><div id="result"></div>`:'<p>點選下方連結，了解更多資訊或聯繫事務所。</p>'}<div class="links"><a href="https://lin.ee/" id="line" target="_blank" rel="noopener">LINE：@wylaw</a><a href="https://weiandyang.com" target="_blank" rel="noopener">官方網站</a></div>`;p.querySelector('#line').href='https://line.me/R/ti/p/@wylaw';p.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{let ok=Number(b.dataset.answer)===t.correct;p.querySelector('#result').innerHTML=`<div class="result"><strong>${ok?'答對了！':'再認識一下相關觀念'}</strong><br>${t.explain}</div>`})}document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.id)));show('court');</script></body></html>
