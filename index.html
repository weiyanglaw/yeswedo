import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';
const MANIFEST={"castle":["assets/castle_00.part","assets/castle_01.part","assets/castle_02.part","assets/castle_03.part","assets/castle_04.part","assets/castle_05.part","assets/castle_06.part"],"litigation":["assets/litigation_00.part","assets/litigation_01.part","assets/litigation_02.part","assets/litigation_03.part","assets/litigation_04.part"],"medical":["assets/medical_00.part","assets/medical_01.part","assets/medical_02.part"],"family":["assets/family_00.part","assets/family_01.part"],"business":["assets/business_00.part","assets/business_01.part"],"library":["assets/library_00.part"],"bridge":["assets/bridge_00.part"]};const names=['德威陽城堡','訴訟法律島','醫療法律島','家庭生活島','企業商務島','法律知識島'];const emoji=['🏰','⚖️','🏥','🏡','🏢','📚'];const xy=[[0,0],[0,-66],[62,-20],[39,54],[-39,54],[-62,-20]];const scene=new THREE.Scene();scene.background=new THREE.Color('#c8eafb');scene.fog=new THREE.Fog('#c8eafb',175,370);const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,650);camera.position.set(76,102,145);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);const orbit=new OrbitControls(camera,renderer.domElement);orbit.enableDamping=true;orbit.target.set(0,2,0);orbit.minDistance=12;orbit.maxDistance=240;orbit.maxPolarAngle=Math.PI*.49;scene.add(new THREE.HemisphereLight(0xffffff,0x94b5c0,2.8));const sun=new THREE.DirectionalLight(0xfff2d3,3.2);sun.position.set(50,90,20);scene.add(sun);const loader=new GLTFLoader();const status=document.getElementById('status');const mats={grass:new THREE.MeshStandardMaterial({color:'#8bdc9a',roughness:.9}),rock:new THREE.MeshStandardMaterial({color:'#b8a7be',roughness:.95}),gold:new THREE.MeshStandardMaterial({color:'#ffd878',metalness:.55,roughness:.3}),white:new THREE.MeshStandardMaterial({color:'#fff7e8',roughness:.7})};const rainbow=['#ff5e8a','#ffa449','#ffe866','#63dcb1','#5fc9ff','#aa82ec'];const rm=rainbow.map(c=>new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.14,roughness:.55}));
async function getGLB(key){const chunks=MANIFEST[key];let arrays=[],total=0;for(let i=0;i<chunks.length;i++){const r=await fetch(chunks[i]);if(!r.ok)throw Error(chunks[i]+': '+r.status);const a=await r.arrayBuffer();arrays.push(new Uint8Array(a));total+=a.byteLength;status.textContent='正在讀取 '+key+' '+(i+1)+'/'+chunks.length;}const all=new Uint8Array(total);let at=0;for(const a of arrays){all.set(a,at);at+=a.byteLength}arrays=[];return await new Promise((res,rej)=>loader.parse(all.buffer,'',res,rej))}
function mesh(geo,mat,parent,x=0,y=0,z=0){const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);parent.add(m);return m}
const groups=[];for(let i=0;i<6;i++){const g=new THREE.Group();g.position.set(xy[i][0],0,xy[i][1]);scene.add(g);groups.push(g);const r=i===0?21:17;mesh(new THREE.CylinderGeometry(r,r*.82,6,12),mats.grass,g,0,-3,0);const cone=mesh(new THREE.ConeGeometry(r*.78,19,12),mats.rock,g,0,-15,0);cone.rotation.z=Math.PI;const ring=mesh(new THREE.TorusGeometry(r-.2,.32,8,90),mats.gold,g,0,.1,0);ring.rotation.x=Math.PI/2;for(let k=0;k<10;k++){const a=k*Math.PI*2/10;const flower=mesh(new THREE.SphereGeometry(.45,8,8),rm[(k+i)%6],g,Math.cos(a)*(r-1.2),.55,Math.sin(a)*(r-1.2));}}
function fit(obj,width){obj.updateMatrixWorld(true);let b=new THREE.Box3().setFromObject(obj);const s=b.getSize(new THREE.Vector3());if(s.x<.001||s.z<.001)return;const scale=width/Math.max(s.x,s.z);obj.scale.multiplyScalar(scale);obj.updateMatrixWorld(true);b=new THREE.Box3().setFromObject(obj);const c=b.getCenter(new THREE.Vector3());obj.position.x-=c.x;obj.position.z-=c.z;obj.position.y-=b.min.y;}
const keys=['castle','litigation','medical','family','business','library'];const widths=[33,31,28,29,27,29];async function loadIsland(i){try{const g=await getGLB(keys[i]);const model=g.scene;fit(model,widths[i]);groups[i].add(model);status.textContent='已載入 '+names[i];}catch(e){console.error(e);status.textContent=names[i]+' 讀取失敗：'+e.message}}
const bridges=[];for(let i=1;i<6;i++){const a=new THREE.Vector3(xy[0][0],.65,xy[0][1]),b=new THREE.Vector3(xy[i][0],.65,xy[i][1]);const d=b.clone().sub(a),len=d.length();const group=new THREE.Group();group.position.copy(a.clone().add(b).multiplyScalar(.5));group.rotation.y=Math.atan2(d.x,d.z);scene.add(group);bridges.push({group,len});mesh(new THREE.BoxGeometry(5.8,.65,len+1),mats.white,group);for(let k=0;k<Math.ceil(len/2.5);k++){const z=-len/2+(k+.5)*len/Math.ceil(len/2.5);mesh(new THREE.BoxGeometry(5.65,.08,len/Math.ceil(len/2.5)+.01),rm[k%6],group,0,.37,z)}for(const side of [-1,1]){mesh(new THREE.BoxGeometry(.24,.22,len),mats.gold,group,side*2.8,1.65,0);for(let k=0;k<=Math.ceil(len/4);k++){const z=-len/2+k*len/Math.ceil(len/4);mesh(new THREE.CylinderGeometry(.12,.17,1.45,8),mats.gold,group,side*2.8,.9,z);mesh(new THREE.IcosahedronGeometry(.36,0),rm[k%6],group,side*2.8,1.94,z)}}}

async function addOriginalBridge(){try{const gltf=await getGLB('bridge');const orig=gltf.scene;let source=null;orig.traverse(o=>{if(o.name.startsWith('Bridge.001'))source=o});if(!source){status.textContent='彩虹橋已完成（原橋造型無法辨識）';return}for(const {group,len} of bridges){const clone=source.clone(true);fit(clone,5.1);clone.position.y=.42;group.add(clone)}status.textContent='六座島與五條彩虹橋已完成載入';}catch(e){console.warn('bridge',e)}}

const actor=new THREE.Group();scene.add(actor);const skin=new THREE.MeshStandardMaterial({color:'#efc3a4'}),suit=new THREE.MeshStandardMaterial({color:'#45567b'}),hair=new THREE.MeshStandardMaterial({color:'#433329'});mesh(new THREE.CylinderGeometry(.43,.53,1.25,10),suit,actor,0,1.18,0);mesh(new THREE.SphereGeometry(.37,12,10),skin,actor,0,2.13,0);mesh(new THREE.SphereGeometry(.4,12,10),hair,actor,0,2.4,-.06);for(const x of [-.24,.24])mesh(new THREE.CylinderGeometry(.12,.14,.75,8),suit,actor,x,.42,0);actor.position.set(0,0,10);const clickable=[];function person(parent,x,z,color,label){const g=new THREE.Group();parent.add(g);g.position.set(x,0,z);mesh(new THREE.CylinderGeometry(.45,.5,1.25,9),new THREE.MeshStandardMaterial({color}),g,0,1.2,0);mesh(new THREE.SphereGeometry(.35,12,8),skin,g,0,2.05,0);mesh(new THREE.SphereGeometry(.37,12,8),hair,g,0,2.32,-.08);g.userData.label=label;g.traverse(o=>{if(o.isMesh){o.userData.label=label;clickable.push(o)}});return g}person(groups[0],-6,6,'#2d415a','林律師');person(groups[0],-9,9,'#f6a9c2','馬尾小編');person(groups[0],-5,10,'#33363d','短髮小編');person(groups[0],-2,8,'#f6e6d5','櫃檯小編');
const dialogs={'林律師':['歡迎來到德威陽國際法律事務所。我是林柏均律師，具台灣與紐約州律師資格。','跨國商務契約、公司治理、智慧財產與訴訟，越早辨識風險，越能避免爭議。','學歷：Emory University 法律碩士（LL.M.）、University of La Verne 企業管理碩士（MBA）。'],'馬尾小編':['歡迎來到有法度！你可以走過彩虹橋探索不同法律島嶼。','想安排法律諮詢嗎？歡迎透過 LINE：@wylaw 聯絡本所。'],'短髮小編':['公司契約、勞動爭議、營業秘密、民刑事訴訟，我們都有對應的法律服務。','簽約前先確認當事人、權利義務、違約責任與爭議解決方式，別只看價錢！'],'櫃檯小編':['德威陽國際法律事務所歡迎你！官網：weiandyang.com。','法律問題可以先整理事實時間軸與文件，再與本所預約諮詢。']};const islandDialogs=[['歡迎來到德威陽城堡！從這裡出發，探索五座法律島嶼。'],['訴訟法律島：民事、刑事、行政訴訟的程序與證據，常常決定案件的處理方向。'],['醫療法律島：醫療爭議應先整理病歷、診療時間軸及溝通紀錄。'],['家庭生活島：離婚、親權、扶養費、繼承及家事爭議，都需要個別評估。'],['企業商務島：契約、公司治理、國際交易、營業秘密與智慧財產，是企業風險管理的重點。'],['法律知識島：探索法律常識；實際案件仍須依具體事實及最新法令評估。']];let talkName='',talkIdx=0;function talk(name){talkName=name;talkIdx=0;renderTalk()}function renderTalk(){const list=dialogs[talkName]||islandDialogs[names.indexOf(talkName)]||['歡迎探索德威陽｜有法度！'];document.getElementById('dialogTitle').textContent=talkName;document.getElementById('dialogText').textContent=list[talkIdx];document.getElementById('dialog').style.display='block'}document.getElementById('next').onclick=()=>{const list=dialogs[talkName]||islandDialogs[names.indexOf(talkName)]||[''];if(++talkIdx>=list.length)document.getElementById('dialog').style.display='none';else renderTalk()};
let follow=false,overview=true,joyX=0,joyY=0;const joy=document.getElementById('joy'),knob=document.getElementById('knob');function moveJoy(e){const r=joy.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.max(1,Math.hypot(dx,dy)),f=Math.min(1,l/42);joyX=dx/l*f;joyY=dy/l*f;knob.style.transform=`translate(${joyX*38}px,${joyY*38}px)`}joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId);moveJoy(e)});joy.addEventListener('pointermove',e=>{if(joy.hasPointerCapture(e.pointerId))moveJoy(e)});function release(){joyX=joyY=0;knob.style.transform=''}joy.addEventListener('pointerup',release);joy.addEventListener('pointercancel',release);
function goto(i){actor.position.set(xy[i][0],0,xy[i][1]+(i===0?9:7));document.getElementById('where').textContent=emoji[i]+' '+names[i];talk(names[i]);follow=true;overview=false;camera.position.set(actor.position.x+14,22,actor.position.z+24);orbit.target.set(actor.position.x,2,actor.position.z);orbit.update()}document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>goto(Number(b.dataset.go)));document.getElementById('home').onclick=()=>goto(0);document.getElementById('lawyer').onclick=()=>talk('林律師');let si=0;document.getElementById('staff').onclick=()=>talk(['馬尾小編','短髮小編','櫃檯小編'][si++%3]);document.getElementById('overview').onclick=()=>{follow=false;overview=true;camera.position.set(76,102,145);orbit.target.set(0,0,0)};document.getElementById('follow').onclick=()=>{follow=true;overview=false};document.getElementById('help').onclick=()=>talk('德威陽城堡');document.getElementById('interact').onclick=()=>{let nearest=0,best=Infinity;for(let i=0;i<6;i++){const d=Math.hypot(actor.position.x-xy[i][0],actor.position.z-xy[i][1]);if(d<best){best=d;nearest=i}}talk(names[nearest])};const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.movementX)>5||Math.abs(e.movementY)>5)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hits=ray.intersectObjects(clickable);if(hits.length)talk(hits[0].object.userData.label)});
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(joyX||joyY){const forward=new THREE.Vector3();camera.getWorldDirection(forward);forward.y=0;forward.normalize();const right=new THREE.Vector3().crossVectors(forward,new THREE.Vector3(0,1,0)).normalize();const v=right.multiplyScalar(joyX).add(forward.multiplyScalar(-joyY));actor.position.addScaledVector(v,dt*10);const onIsland=xy.some(([x,z],i)=>Math.hypot(actor.position.x-x,actor.position.z-z)<(i===0?20:16));const onBridge=bridges.some(({group,len})=>{const p=actor.position.clone();group.worldToLocal(p);return Math.abs(p.x)<3.2&&Math.abs(p.z)<len/2});if(!onIsland&&!onBridge)actor.position.addScaledVector(v,-dt*10);follow=true;overview=false;}if(follow){const target=new THREE.Vector3(actor.position.x,2,actor.position.z);const delta=target.clone().sub(orbit.target);orbit.target.lerp(target,.1);camera.position.addScaledVector(delta,.1)}orbit.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
