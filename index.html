 const skinMat=mat(settings.skin), hairMat=mat(settings.hairColor),topMat=mat(settings.top),bottomMat=mat(settings.bottom),shoeMat=mat('#fff8ef'),eyeMat=mat('#302a31'),whiteMat=mat('#ffffff'),pinkMat=mat('#ef98a4');
 const add=(geometry,material,x,y,z,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(geometry,material);m.position.set(x,y,z);m.scale.set(sx,sy,sz);g.add(m);return m};

 // Large head and tiny body: deliberately toy-like proportions.
 add(ball,skinMat,0,1.74,0,0.58,0.57,0.51);
 add(ball,hairMat,0,2.04,-.09,.61,.42,.52);
 const female=settings.gender==='female';
 if(settings.hair==='bob'||settings.hair==='long'||settings.hair==='ponytail'||settings.hair==='twintail'){
  for(const x of [-.51,.51])add(ball,hairMat,x,1.69,-.10,.16,settings.hair==='long'?.62:.36,.34);
 }
 if(settings.hair==='long')add(ball,hairMat,0,1.33,-.43,.48,.58,.18);
 if(settings.hair==='ponytail')add(ball,hairMat,.42,1.85,-.47,.23,.52,.23);
 if(settings.hair==='twintail')for(const x of [-.65,.65])add(ball,hairMat,x,1.62,-.15,.22,.42,.25);
 if(settings.hair==='curly')for(let i=0;i<11;i++){const angle=i/11*Math.PI*2;add(ball,hairMat,Math.cos(angle)*.52,2.05+Math.sin(angle)*.22,-.08,.20,.22,.20)}
 // Fringe, eyes, blush, small smiling mouth. Face points toward positive Z.
 for(const x of [-.23,.23]){
  add(ball,whiteMat,x,1.78,.462,.125,.16,.055);
  add(ball,eyeMat,x,1.77,.512,.079,.115,.042);
  add(ball,pinkMat,x*1.56,1.60,.455,.12,.065,.035);
 }
 add(ball,mat('#9e575e'),0,1.52,.50,.09,.025,.025);
 if(female)add(ball,hairMat,0,2.17,.27,.43,.14,.22);
 const dress=settings.outfit==='dress', skirt=['skirt','longskirt'].includes(settings.outfit);
 add(ball,topMat,0,.96,0,.38,.47,.29);
 for(const x of [-.47,.47]){
  add(ball,topMat,x,1.05,0,.17,.21,.19);
  add(ball,skinMat,x*1.17,.78,0,.12,.24,.12);
  add(ball,skinMat,x*1.17,.56,.01,.13,.13,.13);
 }
 if(dress||skirt){
  const h=settings.outfit==='longskirt'?.70:.46;
  const geo=new THREE.CylinderGeometry(.30,.55,h,20,1);
  add(geo,dress?topMat:bottomMat,0,.69-(h-.46)/2,0);
 }else{
  for(const x of [-.19,.19])add(ball,bottomMat,x,.55,0,.20,settings.outfit==='shorts'?.21:.38,.23);
 }
 for(const x of [-.20,.20]){
  add(ball,skinMat,x,.27,0,.13,.20,.13);
  add(ball,shoeMat,x,.14,.09,.22,.13,.30);
 }
 return g;
}
