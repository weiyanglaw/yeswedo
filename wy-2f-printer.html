<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>辦公室叛亂中 試玩</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%}body{margin:0;background:#0b1f2f;overflow:hidden;font-family:'PingFang TC','Noto Sans TC',system-ui,sans-serif;color:#4A3420;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:6px}
.card{position:relative;width:min(100%,420px);padding:8px;border-radius:30px;background:linear-gradient(#FFEFB8,#E9C46A 35%,#C08A2E 70%,#F3D27A);box-shadow:0 8px 20px #0008}
.in{border-radius:24px;background:repeating-linear-gradient(transparent 0 27px,#EAD9B4 27px 28px),#FFFBF2;padding:14px 14px 12px;border:1.5px solid #8A6424;position:relative;min-height:0}
.hd{display:flex;align-items:center;gap:8px;padding-right:84px}.hd img{width:40px}.hd small{display:block;font:800 12px sans-serif;color:#8A6424}.hd b{font:900 20px sans-serif;color:#1A2C66}
.stamp{position:absolute;right:14px;top:12px;width:70px;height:82px;background:#3F63B5;border:3.5px dotted #FFF8EA;outline:2px solid #3F63B5;transform:rotate(6deg);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#FFF3D6;font:900 13px sans-serif}.stamp img{width:40px;filter:brightness(1.6) saturate(.6)}
.rule{height:3px;background:linear-gradient(90deg,#E9C46A,#C08A2E);margin:12px 88px 12px 0;border-radius:2px}
.foot{margin-top:12px;padding:7px 0;border-radius:12px;background:#F3E2B8;text-align:center;font:800 12.5px sans-serif;color:#8A6424}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:9px 0;border-radius:20px;border:2px solid #E2C88C;background:#FFF8EA;color:#8A6424;font:900 13px sans-serif}.tabs button.on{background:linear-gradient(#FFEFB8,#E9C46A 50%,#C9963C);color:#4A3420;border-color:#C08A2E}
.big{width:100%;padding:13px 0;border:0;border-radius:24px;background:#1F6B4F;color:#fff;font:900 16px sans-serif;box-shadow:0 4px 0 #0f3f2e;margin-top:10px}
.who{display:flex;gap:10px;align-items:center;background:#E9F6EF;border:1.5px solid #9ED3B8;border-radius:14px;padding:8px 10px;margin-top:8px}.who img{width:52px}.who b{display:block;font:900 13px sans-serif;color:#1F6B4F}.who span{font:700 13px/1.45 sans-serif}

.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,251,242,.93);border-radius:18px;padding:16px}
.ov.lcd{background:rgba(169,194,74,.96);border-radius:6px}
.res{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;width:100%}
.res small{font:800 13px sans-serif;color:#8A6424}.res b{font:900 26px sans-serif;color:#1A2C66}.res em{font:900 16px sans-serif;font-style:normal;color:#fff;background:linear-gradient(#E9C46A,#C08A2E);padding:4px 16px;border-radius:14px}
.lcd .res b{color:#2E3B12}.lcd .res small{color:#2E3B12}
.res .rule2{font:700 14px/1.6 sans-serif;color:#4A3420;text-wrap:pretty;word-break:keep-all}
.lcd .res .rule2{color:#2E3B12}
.say{display:flex;gap:8px;align-items:center;background:#FFF8EA;border:1.5px solid #E2C88C;border-radius:14px;padding:6px 10px;text-align:left}.say img{width:46px}.say span{font:800 13px/1.45 sans-serif;color:#4A3420;word-break:keep-all}
.bar{display:flex;justify-content:space-between;font:900 15px sans-serif;color:#1A2C66;margin-bottom:6px;padding:0 4px}
.res .who{text-align:left;width:100%}.res .who b{font:900 13px sans-serif;color:#1F6B4F;display:block}.res .who span{font:700 13px/1.45 sans-serif}
#snPromo .who{margin-top:10px}
.hint{margin-top:6px;text-align:center;font:700 12.5px sans-serif;color:#8A6424}
.nokia{margin:0 auto;width:300px;padding:18px 18px 16px;border-radius:46px 46px 70px 70px;background:radial-gradient(120% 80% at 30% 10%,#E6F4EC,#9ED3B8 55%,#5FA98A);box-shadow:inset 0 -8px 0 #3E8A6C,inset 0 4px 0 #fff8,0 6px 0 #C08A2E,0 10px 16px #0005;border:3px solid #E9C46A}
.lcdwrap{position:relative;width:252px;height:300px;margin:0 auto;border-radius:10px;padding:0;background:#2E3B12;box-shadow:0 0 0 6px #1F4D45,0 0 0 9px #E9C46A}
#sn{display:block;width:252px;height:300px;border-radius:6px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin-top:16px}
.pad button{border:0;border-radius:22px;background:radial-gradient(circle at 35% 30%,#fff,#FFF3D6 40%,#E9C46A);box-shadow:0 4px 0 #C08A2E;font:900 15px sans-serif;color:#4A3420}
.pad .u{grid-column:2}.pad .l{grid-column:1;grid-row:2}.pad .d{grid-column:2;grid-row:2}.pad .r{grid-column:3;grid-row:2}
.pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #C08A2E}
.res{max-width:100%}.res>*{max-width:100%}.res .rule2{width:100%}
.ov{background:rgba(255,251,242,.985)}.res.start{gap:14px}.res.start .ttl{font:900 30px sans-serif;color:#1A2C66;letter-spacing:2px}
.res.start .hero{width:150px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.15));animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-6px)}}
.steps{display:flex;gap:10px;justify-content:center;width:100%}.steps div{flex:1;font-size:14px!important;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border-radius:16px;background:#FFF8EA;border:2px solid #E2C88C;font:900 15px/1.3 sans-serif;color:#4A3420;text-align:left;text-wrap:balance}
.steps i{font-style:normal;width:24px;height:24px;border-radius:50%;background:linear-gradient(#FFE27A,#C9963C);color:#4A3420;display:inline-flex;align-items:center;justify-content:center;font:900 14px sans-serif;flex:none}
.res .big{max-width:280px}button{-webkit-user-select:none;user-select:none}
.say img{width:46px;flex:none}.say,.who{max-width:100%;box-sizing:border-box}.say span,.who span,.who b,.res .rule2,.res small,.res b{line-break:strict;word-break:keep-all!important;text-wrap:pretty;min-width:0}.say>span,.who>div{flex:1;min-width:0}
</style><style>/* v514 網站內嵌（iframe）用：透明底＋右上金色關閉鈕 */
body.emb{background:transparent!important;padding:0!important}
.xcl{position:absolute;top:-4px;right:-4px;z-index:50;width:38px;height:38px;border-radius:50%;border:2px solid #fff;background:linear-gradient(#FFEFB8,#E9C46A 40%,#C08A2E);color:#5A3A10;font:900 21px/1 sans-serif;box-shadow:0 3px 0 #8A6424,0 4px 10px #0005;cursor:pointer;display:none}
body.emb .xcl{display:block}
body.emb .tabs{display:none!important}
body.emb{min-height:0!important;height:100vh;overflow:hidden;display:block!important}body.emb .card{transform-origin:top center;margin:0 auto!important}
